<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Audit Ledger</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="bottom-dock animate-dock-in" id="global-navigation-dock">
            <a href="index.html" class="dock-item"> Dashboard</a>
            <a href="goals.html" class="dock-item"> Canvas</a>
            <a href="reflection.html" class="dock-item active"> Reflect</a>
            <a href="timeline.html" class="dock-item"> Timeline</a>
        </nav>

        <main class="main-viewport">
            <header class="view-header">
                <h1>Monthly Reflection Ledger</h1>
                <p style="color: var(--text-secondary)" id="reflection-tally-hero">Total tasks completed this month: 0</p>
            </header>

            <section class="reflect-grid">
                <div class="reflect-card" id="reflect-top-goal-card"></div>
                <div class="reflect-card" id="reflect-focus-card"></div>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">Daily Completions This Month</h3>
                <p class="reflect-card-subtitle" id="reflect-daily-peak"></p>
                <div class="bar-chart" id="reflect-daily-chart"></div>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">Yearly Overview</h3>
                <p class="reflect-card-subtitle">Tasks completed per month, archived automatically at each month's end.</p>
                <div class="bar-chart yearly" id="reflect-yearly-chart"></div>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">All Completed Tasks</h3>
                <div class="reflection-ledger" id="reflection-log-canvas"></div>
            </section>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
