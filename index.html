<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Focus System</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="bottom-dock animate-dock-in" id="global-navigation-dock">
            <a href="index.html" class="dock-item active">Dashboard</a>
            <a href="goals.html" class="dock-item" id="goals-nav-trigger">Canvas</a>
            <a href="reflection.html" class="dock-item">Reflect</a>
        </nav>

        <main class="main-viewport" id="dashboard-viewport">
            <header class="view-header" id="dashboard-header">
                <h1>Focus Analytics Console</h1>
                <p style="color: var(--text-secondary)">Real-time task counters across active operational goals.</p>
            </header>

            <section class="reflect-grid">
                <div class="reflect-card" id="dashboard-streak-card"></div>
                <div class="reflect-card" id="dashboard-focus-week-card"></div>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">Quick Add Task</h3>
                <form class="quick-add-form" id="quick-add-form">
                    <input type="text" id="quick-add-title" placeholder="Task title" required>
                    <select id="quick-add-goal">
                        <option value="">Rogue task (no goal)</option>
                    </select>
                    <input type="text" id="quick-add-time" placeholder="Time (optional)">
                    <button type="submit">+ Add</button>
                </form>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">Rogue Tasks</h3>
                <p class="reflect-card-subtitle">Not tied to any goal yet.</p>
                <div id="dashboard-rogue-list"></div>
            </section>

            <section class="reflect-card">
                <h3 class="reflect-card-title">Carried-Over Tasks</h3>
                <p class="reflect-card-subtitle">Still open from a previous day — jump back to the Canvas to finish them off.</p>
                <div id="dashboard-carryover-list"></div>
            </section>

            <section class="dashboard-grid" id="dashboard-metrics-container">
                </section>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
