<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Architecture Workspace</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="bottom-dock animate-dock-in" id="global-navigation-dock">
            <a href="index.html" class="dock-item"> Dashboard</a>
            <a href="goals.html" class="dock-item active"> Canvas</a>
            <a href="reflection.html" class="dock-item"> Reflect</a>
        </nav>

        <div class="canvas-container canvas-active" id="spatial-canvas-root">
            <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

            <div class="utility-stack" id="utility-stack">
                <div class="utility-bar action-drawer" id="action-drawer">
                    <div class="utility-bar-line"></div>
                    <div class="utility-bar-content">
                        <span class="utility-bar-label">Actions</span>
                        <button class="utility-action-btn" id="action-trigger-make-goal">+ Set Goal</button>
                        <button class="utility-action-btn" id="action-trigger-make-task">+ Create Task</button>
                    </div>
                </div>
                <div class="utility-bar feature-drawer" id="feature-drawer">
                    <div class="utility-bar-line"></div>
                    <div class="utility-bar-content">
                        <span class="utility-bar-label">Features</span>
                        <button class="utility-action-btn" id="feature-align-grid">Align Grid</button>
                        <button class="utility-action-btn" id="feature-purge-tasks">Purge Loose Tasks</button>
                        <button class="utility-action-btn" id="feature-focus-mode">Toggle Focus Mode</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="task-creation-modal">
        <div class="modal-content">
            <h3>Configure Target Context</h3>
            <input type="text" id="modal-task-title" placeholder="Target Objective Name">
            <input type="text" id="modal-task-time" placeholder="Operational Time Frame (ex: 4pm - 5pm)">
            <div style="display:flex; justify-content: flex-end; gap:8px;">
                <button class="block-input" style="color:black; width:auto; cursor:pointer;" id="modal-cancel">Cancel</button>
                <button class="block-input" style="color:blue; width:auto; cursor:pointer;" id="modal-save">Commit</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
