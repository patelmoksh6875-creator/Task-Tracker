<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Architecture Workspace</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="bottom-dock animate-dock-in" id="global-navigation-dock">
            <a href="index.html" class="dock-item">⏱️ Dashboard</a>
            <a href="goals.html" class="dock-item active">🎯 Canvas Workspace</a>
            <a href="reflection.html" class="dock-item">📊 Reflection Log</a>
        </nav>

        <div class="canvas-container canvas-active" id="spatial-canvas-root">
            <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

            <div class="canvas-utility-tab" id="canvas-dropdown-tab">
                <span id="tab-label-text">⚙️ Workspace Tools</span>
                <div class="drawer-actions">
                    <button class="block-input" style="cursor:pointer; text-align:left;" id="action-trigger-make-goal">+ Create Goal</button>
                    <button class="block-input" style="cursor:pointer; text-align:left;" id="action-trigger-make-task">+ Rogue Task</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="task-creation-modal">
        <div class="modal-content">
            <h3>Configure Target Context</h3>
            <input type="text" id="modal-task-title" placeholder="Target Objective Name">
            <input type="text" id="modal-task-time" placeholder="Operational Time Frame (ex: 4pm - 5pm)">
            <div style="display:flex; justify-content: flex-end; gap:8px;">
                <button class="block-input" style="color:black; width:auto; cursor:pointer;" id="modal-cancel">Cancel</button>
                <button class="block-input" style="color:blue; width:auto; cursor:pointer;" id="modal-save">Commit</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
